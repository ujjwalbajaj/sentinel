[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./" },
]

[rpc_endpoints]
bsc = "${BSC_RPC}"
base = "${BASE_RPC}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
